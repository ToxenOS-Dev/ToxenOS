set timeout=3
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,800x600x32,auto
terminal_output gfxterm
set gfxpayload=keep

menuentry "ToxenOS" {
    insmod all_video
    insmod multiboot2
    multiboot2 /boot/kernel.bin
    module2 /boot/disk.img
    boot
}

menuentry "ToxenOS (safe video mode)" {
    insmod all_video
    insmod multiboot2
    set gfxpayload=text
    multiboot2 /boot/kernel.bin
    module2 /boot/disk.img
    boot
}

menuentry "Install ToxenOS to disk" {
    insmod all_video
    insmod multiboot2
    multiboot2 /boot/kernel.bin tox_install
    module2 /boot/disk.img
    boot
}
