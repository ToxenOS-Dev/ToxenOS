set timeout=3
set default=0

# Load video modules for UEFI GOP
insmod efi_gop
insmod efi_uga
insmod all_video
insmod video_bochs
insmod video_cirrus

set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "ToxenOS" {
    insmod part_gpt
    insmod part_msdos
    insmod all_video
    insmod multiboot2
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "ToxenOS (safe video mode)" {
    insmod all_video
    insmod multiboot2
    set gfxpayload=text
    multiboot2 /boot/kernel.bin
    boot
}
