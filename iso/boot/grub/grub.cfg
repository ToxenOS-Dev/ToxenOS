set timeout=3
set default=0

insmod all_video
set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "ToxenOS" {
    insmod all_video
    insmod multiboot2
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "ToxenOS (safe video mode)" {
    insmod all_video
    insmod multiboot2
    set gfxpayload=text
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "Install ToxenOS to disk" {
    insmod all_video
    insmod multiboot2
    multiboot2 /boot/kernel.bin tox_install
    boot
}
